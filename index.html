<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>自然科段考學習行事曆</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap"><style id="app-css">
/* Layout: 頂部工具列＋分頁；教師端左表單右預覽，學生端單欄卡片；列印版 A4 橫式 */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9efec; --fg:#17201c; --muted:#5a6762; --line:#d3ddd9;
  --accent:#1c6a55; --accent-fg:#ffffff; --danger:#b42318; --warn:#9a5b00; --hol:#e4e8e6; --today:#fff1b8;
  --chip-s:62%; --chip-l:90%; --chip-fg-s:58%; --chip-fg-l:28%;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18211d; --surface-2:#212c27; --fg:#e3ebe7; --muted:#9aa9a2; --line:#2f3c36;
  --accent:#5fc6a5; --accent-fg:#0a1612; --danger:#ff8f84; --warn:#f2b45c; --hol:#222b27; --today:#3b3517;
  --chip-s:32%; --chip-l:24%; --chip-fg-s:72%; --chip-fg-l:80%; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18211d; --surface-2:#212c27; --fg:#e3ebe7; --muted:#9aa9a2; --line:#2f3c36;
  --accent:#5fc6a5; --accent-fg:#0a1612; --danger:#ff8f84; --warn:#f2b45c; --hol:#222b27; --today:#3b3517;
  --chip-s:32%; --chip-l:24%; --chip-fg-s:72%; --chip-fg-l:80%; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
#app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:8px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.top .spacer{flex:1}
.calpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;padding:4px 6px}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.tab{border:none;background:transparent;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.status{font-size:.82rem;color:var(--muted)}
.status.dirty{color:var(--warn);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.field.grow{flex:1 1 220px}
.days{display:flex;gap:4px}
.days label{display:flex;align-items:center;justify-content:center;width:34px;height:32px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.unit .acts{grid-column:1/-1;grid-row:2}
.unit .ord{grid-column:3;grid-row:1}
.unit .acts{display:flex;gap:4px;flex-wrap:wrap}
.unit .acts label.on{border-color:transparent;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));font-weight:700}
.unit .acts input{position:absolute;opacity:0;pointer-events:none}
.unit .ord{display:flex;gap:2px}
.unit .mergebar{grid-column:1/-1;display:flex;gap:14px;margin-top:-2px}
.unit .mergebar:empty{display:none}
.jointog{font-size:.74rem;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:0 8px;color:var(--muted)}
.jointog.on{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:700}
.unit .mergebar{align-items:center;flex-wrap:wrap}
.linkbtn{border:none;background:none;color:var(--accent);font-size:.78rem;padding:0;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
@media (max-width:640px){.unit{grid-template-columns:96px minmax(0,1fr) auto}}
.rule{font-size:.82rem;line-height:1.7;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.rule b{color:var(--fg)}
.warn{border-left:3px solid var(--warn);background:var(--surface-2);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.85rem}
.warn li{margin-block:2px}
.notice{border:1px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;color:var(--muted)}

/* chips */
.u0{--h:212}.u1{--h:26}.u2{--h:268}.u3{--h:146}.u4{--h:350}.u5{--h:188}.u6{--h:46}.u7{--h:318}.u8{--h:100}.u9{--h:232}
.chip{display:block;font-size:.74rem;line-height:1.35;border-radius:4px;padding:1px 5px;margin-top:2px;background:hsl(var(--h,200) var(--chip-s) var(--chip-l));color:hsl(var(--h,200) var(--chip-fg-s) var(--chip-fg-l));overflow-wrap:anywhere}
.chip.k-class{font-weight:700}
.chip.k-submit{background:transparent;border:1.5px solid hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));font-weight:700}
.chip.k-write{background:transparent;border:1px dashed hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l))}
.chip.k-open{background:transparent;padding-left:0}
.chip.k-due{background:transparent;color:var(--danger);font-weight:700;padding-left:0}
.chip.k-boss{background:var(--danger);color:var(--surface);font-weight:800}
.chip.k-exam{background:var(--fg);color:var(--bg);font-weight:800}
.chip.k-custom{background:transparent;color:var(--fg);padding-left:0}
.chip.k-fixed{background:var(--surface-2);color:var(--fg);font-weight:700}
.cellsec{font-size:.62rem;color:var(--muted);letter-spacing:.08em;margin-top:3px;border-top:1px dotted var(--line)}
.wlabel{font-size:.66rem;color:var(--accent);font-weight:700}
.actchip{display:inline-flex;align-items:center;gap:2px;font-size:.8rem;border-radius:999px;padding:1px 4px 1px 10px;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));font-weight:700}
.actchip button{border:none;background:transparent;color:inherit;padding:0 4px;line-height:1}
.addact{display:inline-flex;gap:4px;align-items:center}
.addact button{font-size:.76rem;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:1px 8px}
.addact input{width:110px;font-size:.8rem;padding:2px 6px}
.steps{display:flex;flex-wrap:wrap;gap:6px 10px}
.steps .st{display:flex;flex-direction:column;gap:1px;min-width:128px}
.steps .st>b{font-size:.72rem;color:var(--muted)}
.gmark.fixed{background:var(--muted);color:var(--surface);border-radius:4px}
.chip.k-holiday{background:transparent;color:var(--muted);padding-left:0}
.tag{display:inline-block;font-size:.68rem;border-radius:3px;padding:0 4px;margin-right:3px;font-weight:700;background:hsl(var(--h,200) var(--chip-s) var(--chip-l));color:hsl(var(--h,200) var(--chip-fg-s) var(--chip-fg-l))}

/* week calendar */
.scroll{overflow-x:auto}
.wcal{width:100%;border-collapse:collapse;table-layout:fixed;min-width:760px;background:var(--surface)}
.wcal th,.wcal td{border:1px solid var(--line);vertical-align:top;padding:4px 5px}
.wcal thead th{background:var(--surface-2);font-size:.8rem;font-weight:700;padding:6px}
.wcal th.wk{width:52px;font-size:.78rem;background:var(--surface-2);text-align:center;vertical-align:middle}
.wcal th.wk b{display:block;font-size:.95rem}
.wcal td{height:86px}
.wcal .d{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.wcal td.noclass{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.wcal td.hol{background:var(--hol)}
.wcal td.hol .d{color:var(--danger)}
.wcal td.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wcal td.out{opacity:.35}
.chip.drag{cursor:grab;user-select:none}
.chip.drag:hover{filter:brightness(.97);box-shadow:0 0 0 1px var(--line)}
.chip.dragging{opacity:.45}
.chip.picked{outline:2px solid var(--accent);outline-offset:1px}
.chip.pinned::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:middle}
.wcal td.dropok,.wcal .wz.dropok{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.wcal td.we{padding:0}
.wcal .wz{padding:4px 5px;min-height:43px}
.wcal .wz+.wz{border-top:1px dotted var(--line)}
.dragbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.84rem;background:var(--surface-2);border-radius:8px;padding:8px 12px}
.dragbar span{flex:1 1 320px;min-width:0}
.chip.k-note{background:transparent;border:1px dashed var(--accent);color:var(--fg)}
.tag.ntag{background:var(--accent);color:var(--accent-fg)}
.tag.ntag.stu{background:var(--warn);color:var(--surface)}
.addnote{border:none;background:transparent;color:var(--accent);font-weight:700;padding:0 4px;margin-left:4px;opacity:.35;cursor:pointer;line-height:1}
.wcal td:hover .addnote,.wcal .wz:hover .addnote,.addnote:focus-visible{opacity:1}
.noteed{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px}
.noteed>b{width:100%}
.tokenbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.86rem}
.tokenbar .field input{width:100%}
.tokenbar .field{min-width:160px}
.wcal .load{font-size:.68rem;color:var(--warn);font-weight:700}

/* gantt */
.gantt{display:grid;min-width:max-content;font-size:.74rem;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.grow-row{display:grid;grid-column:1/-1;border-bottom:1px solid var(--line);min-height:24px}
.grow-row:last-child{border-bottom:none}
.glabel{grid-row:1;grid-column:1;padding:3px 8px;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow-row.unit-row .glabel{font-weight:700}
.grow-row.sub .glabel{color:var(--muted);padding-left:20px}
.gbg{grid-row:1;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.gbg.we{background:var(--surface-2)}
.gbg.hol{background:repeating-linear-gradient(135deg,var(--hol) 0 4px,transparent 4px 7px)}
.gbg.today{background:var(--today)}
.gbar{grid-row:1;align-self:center;height:16px;border-radius:3px;margin:0 1px;font-size:.66rem;line-height:16px;padding:0 4px;white-space:nowrap;overflow:hidden;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));z-index:1}
.gbar.lane{height:10px;line-height:10px;font-size:.6rem;border-radius:2px}
.gbar.self{background:transparent;border:1px solid hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));line-height:8px}
.gbar.write{background:transparent;border:1px dashed hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));line-height:14px}
.gmark{grid-row:1;align-self:center;justify-self:center;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.66rem;background:hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));color:var(--surface);z-index:1}
.gmark.boss{background:var(--danger);border-radius:4px}
.gmark.exam{background:var(--fg);color:var(--bg);border-radius:4px}
.gmark.submit{background:var(--surface);color:hsl(var(--h) var(--chip-fg-s) var(--chip-fg-l));border:1.5px solid currentColor}
.ghead .gbg{text-align:center;font-size:.64rem;color:var(--muted);line-height:1.2;padding-block:3px}
.ghead .gbg b{display:block;color:var(--fg);font-size:.7rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);align-items:center}
.legend .gmark,.legend .gbar{position:static;display:inline-grid;vertical-align:middle;margin-right:4px}
.legend .gbar{display:inline-block;width:28px}

/* adjust table */
.adj{border-collapse:collapse;width:100%;min-width:820px;font-size:.85rem}
.adj th,.adj td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
.adj th{font-size:.76rem;color:var(--muted);font-weight:700}
.adj td.u{font-weight:700;white-space:nowrap}
.adj input[type=date]{width:100%;min-width:122px;padding:4px}
.adj .cell{display:flex;align-items:center;gap:2px}
.adj .ov input,.steps .ov input{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.adj .na{color:var(--muted);text-align:center}
.adj .wd{font-size:.72rem;color:var(--muted);display:block}
.adj .bad .wd,.steps .bad .wd{color:var(--danger);font-weight:700}

/* student */
.sv{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card.urgent{border-color:var(--danger)}
.card.urgent h3{color:var(--danger)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;gap:10px;align-items:baseline}
.tasks .what{flex:1;min-width:0}
.tasks .when{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tasks .left{font-weight:700;color:var(--warn)}
.tasks .left.hot{color:var(--danger)}
.count{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.count .card{padding:10px 14px}
.count .n{font-family:var(--f-display);font-size:1.8rem;font-weight:800;line-height:1.1}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekstrip button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;text-align:center;font-size:.78rem;line-height:1.3}
.weekstrip button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.weekstrip button .dot{display:block;height:6px;margin-top:3px}
.weekstrip button .dot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 1px;opacity:.7}
.weekstrip button.hol{color:var(--danger)}

.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.exp .panel{display:flex;flex-direction:column;gap:8px}
.exp .panel p{margin:0;font-size:.86rem;color:var(--muted);flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:50}
pre.ics{max-height:180px;overflow:auto;font-size:.7rem;background:var(--surface-2);padding:8px;border-radius:6px;white-space:pre}

/* print */
.print-page{background:var(--surface);padding:0}
.print-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:4px;margin-bottom:6px}
.print-head h1{font-size:16pt}
.print-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
@page{size:A4 landscape;margin:8mm}
.print-page{width:281mm;max-width:100%}
.compact .wcal{min-width:0}
.compact .wcal td{height:auto;padding:2px 3px}
.compact .wcal .wz{padding:2px 3px;min-height:0}
.compact .wcal thead th{padding:3px;font-size:.72rem}
.compact .chip{font-size:.66rem;line-height:1.2;padding:0 3px;margin-top:1px}
.compact .chip .tag{font-size:.6rem;padding:0 2px;margin-right:2px}
.compact .cellsec{font-size:0;margin:2px 0 1px;height:0}
.compact .wcal .d{font-size:.7rem}
.compact .wlabel{font-size:.6rem}
.compact .legend{font-size:.68rem;gap:3px 10px}
.compact .print-head{margin-bottom:3px}
.compact .grow-row{min-height:18px}
.compact .gmark{width:15px;height:15px;font-size:.6rem}
.compact .ghead .gbg{font-size:.55rem}
.compact .glabel{font-size:.66rem;padding:2px 4px}
@media print{
  :root{--bg:#fff;--surface:#fff}
  body{font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app{max-width:none;padding:0}
  .noprint,.top,.tabs,.print-bar{display:none!important}
  .print-page{break-after:page;width:auto}
  .print-page:last-child{break-after:auto}
  .wcal{min-width:0}
  .wcal td{height:auto}
  .scroll{overflow:visible}
  .gantt{min-width:0;width:100%;border-radius:0}
  .glabel{position:static}
  .chip{font-size:7pt}
  .gbar{font-size:6pt}
}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s,border-color .15s}}

function md(s){var d=P(s);return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function mdw(s){return md(s)+'（'+WK[dow(s)]+'）';}
function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(P(s));}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function maxD(a,b){return a>b?a:b;}

function looseDate(tok,refYear){
  tok=tok.trim().replace(/\./g,'/');
  var m;
  if((m=tok.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  if((m=tok.match(/^(\d{2,3})[-\/](\d{1,2})[-\/](\d{1,2})$/))) { var y=+m[1]+1911; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'); }
  if((m=tok.match(/^(\d{1,2})[-\/](\d{1,2})$/))) return refYear(+m[1])+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  if((m=tok.match(/^(\d{1,2})月(\d{1,2})日?$/))) return refYear(+m[1])+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0');
  return null;
}
/* lines: "2026-09-25 中秋節", "9/25 中秋節", "10/9~10/10 國慶連假" */
function parseLines(text,anchor){
  var out=[];
  var ay=anchor?P(anchor).getUTCFullYear():new Date().getFullYear(), am=anchor?P(anchor).getUTCMonth()+1:1;
  var ref=function(m){return (am>=7&&m<7)?ay+1:(am<7&&m>=8?ay-1:ay);};
  String(text||'').split(/\n+/).forEach(function(line){
    line=line.trim(); if(!line) return;
    // 日期後面可以不空格，也可以加星期，例如「10/22帶課本」「10/22（四）帶課本」「10/9~10/10 國慶」
    var DT='(\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}|\\d{2,3}[/.]\\d{1,2}[/.]\\d{1,2}|\\d{1,2}[/.]\\d{1,2}|\\d{1,2}月\\d{1,2}日?)';
    var WD='(?:\\s*[（(][一二三四五六日][）)])?';
    var m=line.match(new RegExp('^'+DT+WD+'(?:\\s*[~～至–-]\\s*'+DT+WD+')?\\s*[:：、,，]?\\s*(.*)$'));
    if(!m) return;
    var a=looseDate(m[1],ref); if(!a) return;
    var b=m[2]?looseDate(m[2],ref):null;
    out.push({start:a,end:b&&b>=a?b:a,name:(m[3]||'').trim()});
  });
  return out;
}

/* ---------- scheduling engine ---------- */
function stepsOf(u){var seen={},out=['訂正'];(u.acts||[]).forEach(function(a){a=String(a).trim(); if(a&&!seen[a]&&a!=='訂正'&&a!=='競賽之盾'){seen[a]=1;out.push(a);}});return out.concat(['競賽之盾']);}
var BASEW={'訂正':0.5,'概念釐清':1,'分組挑戰':1,'實驗':1,'競賽之盾':0.5};
function wOf(cal,s){var w=cal.weights||{}; if(w[s]!=null) return +w[s]; if(BASEW[s]!=null) return w[s]!=null?+w[s]:BASEW[s];
  for(var k=0;k<ACTS.length;k++){ if(s.indexOf(ACTS[k])>=0) return w[ACTS[k]]!=null?+w[ACTS[k]]:1; } return 1;}
function abbr(s){ if(ABBR[s]) return ABBR[s]; if(/實驗|探究/.test(s)) return s.indexOf('實驗')>=0?'實':'探'; if(/概念/.test(s)) return '概'; if(/分組|挑戰/.test(s)) return '分'; return String(s).charAt(0); }
/* 固定課：「9/11 顯微鏡操作」佔一節；名稱含（併）表示與其他活動同節、不佔節數；「每週五 科學探究」只標示 */
function parseFixed(text,anchor){
  var weekly={}, dated=[], rest=[];
  String(text||'').split(/\n+/).forEach(function(line){
    line=line.trim(); if(!line) return;
    var m=line.match(/^每?週([一二三四五六日])\s+(.+)$/);
    if(m){ weekly[WK.indexOf(m[1])]=m[2].trim(); return; }
    rest.push(line);
  });
  parseLines(rest.join('\n'),anchor).forEach(function(h){
    var share=/[（(]併[）)]/.test(h.name), half=/[（(]半節[）)]/.test(h.name);
    var name=h.name.replace(/[（(](併|半節)[）)]/g,'').trim()||'課堂活動';
    for(var d=h.start;d<=h.end;d=add(d,1)) dated.push({date:d,name:name,w:share?0:half?0.5:1});
  });
  return {weekly:weekly,dated:dated};
}

/* 節數不夠時：把相鄰單元的分組挑戰合併成同一節（跨章節），直到排得下或無法再改善 */
function missingCount(S){ var n=0; (S.units||[]).forEach(function(r){ n+=(r.missing||[]).length+(r.dates['預習']?0:1); }); (S.warnings||[]).forEach(function(w){ if(/順序顛倒|要分開上/.test(w)) n+=1; }); return n; }

  var G='分組挑戰', ov0=cal.overrides||{}, joins=[], used2={}, merged=[];
  for(var round=0; round<6; round++){
    var cur=missingCount(S); if(!cur) break;
    var idx=[]; (cal.units||[]).forEach(function(u,i){ if(stepsOf(u).indexOf(G)>=0 && ov0[i+':'+G]==null && !used2[i] && !(u.joinNext||[]).length) idx.push(i); });
    var best=null;
    for(var a=0;a+1<idx.length;a++){
      var i=idx[a], j=idx[a+1];
      var T2=scheduleCore(Object.assign({},cal,{__joins:joins.concat([[i,j,G]])}));
      var m=missingCount(T2);
      if(m<cur && (!best||m<best.m)) best={m:m,i:i,j:j,S:T2};
    }
    if(!best) break;
    joins.push([best.i,best.j,G]); used2[best.i]=used2[best.j]=1; S=best.S;
    merged.push((cal.units[best.i].code||'')+' 與 '+(cal.units[best.j].code||''));
  }
  if(merged.length) S.warnings.unshift('節數不夠，已自動把分組挑戰合併進行：'+merged.join('；')+'。');
  S.autoJoins=joins;
  return S;
}
function scheduleCore(cal){

  if(!isDate(cal.start)||!isDate(cal.examStart)){res.error='請先填寫「第一單元預習繳交週」與「段考日期」。';return res;}
  var examEnd=isDate(cal.examEnd)&&cal.examEnd>=cal.examStart?cal.examEnd:cal.examStart;

  }

  // 每個「節次單位」只佔一次節數：一般是單元自己；設定為一起上的活動（joinNext／自動合併）共用一個單位

  U0.forEach(function(u,i){ (u.joinNext||[]).forEach(function(s5){ addJoin(i,i+1,s5); }); });

    var si=avail.indexOf(submit); if(si<0){ si=avail.findIndex(function(x){return x>=submit;}); if(si<0) si=avail.length-1; } prevIdx=si;

    if(r.missing.length) res.warnings.push(r.code+'：'+r.missing.map(lbl).join('、')+' 在段考前排不下，請減少活動、加快新單元的節奏或手動調整。');
    if(r.dates['訂正']&&r.dates['訂正']<r.dates['預習']) res.warnings.push(r.code+' 筆記訂正排在預習繳交之前。');

  var from=first; res.units.forEach(function(r){if(r.write&&r.write.start<from) from=r.write.start;});

}

/* ---------- export builders ---------- */
function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildICS(cal,S){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//exam-study-calendar//ZH-TW','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEscape(cal.title||'段考學習行事曆'),'X-WR-TIMEZONE:Asia/Taipei'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  S.events.forEach(function(e,k){
    if(e.kind==='holiday'||(e.kind==='note'&&e.who!=='student')) return;
    var end=add(e.end||e.date,1);
    L.push('BEGIN:VEVENT','UID:'+(cal.id||'cal')+'-'+k+'-'+e.date+'@exam-study-calendar','DTSTAMP:'+stamp,
      'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+end.replace(/-/g,''),
      'SUMMARY:'+icsEscape('【自然】'+e.text),'TRANSP:TRANSPARENT');
    if(e.kind==='due'||e.kind==='submit'||e.kind==='boss'||(e.kind==='class'&&e.step==='競賽之盾'))
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('明天：'+e.text),'TRIGGER:-PT5H','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(function(l){ // fold at 70 chars
    var o='',s=l; while(s.length>70){o+=s.slice(0,70)+'\r\n ';s=s.slice(70);} return o+s;
  }).join('\r\n')+'\r\n';
}
function buildCSV(cal,S){
  var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"';};
  var g=function(d){var p=d.split('-');return p[1]+'/'+p[2]+'/'+p[0];};
  var rows=[['Subject','Start Date','End Date','All Day Event','Description'].join(',')];
  S.events.forEach(function(e){ if(e.kind==='holiday'||(e.kind==='note'&&e.who!=='student')) return;
    rows.push([q('【自然】'+e.text),g(e.date),g(e.end||e.date),'True',q(cal.title||'')].join(','));});
  return '\ufeff'+rows.join('\r\n');
}

/* ---------- week calendar ---------- */
function legend(){
  return '<div class="legend"><span><span class="chip k-class u0" style="display:inline-block">1-1 概念釐清</span> 課堂活動</span><span><span class="chip k-submit u0" style="display:inline-block">繳交</span> 預習筆記繳交</span><span><span class="chip k-fixed" style="display:inline-block">顯微鏡操作</span> 固定課</span><span><span class="chip k-write u0" style="display:inline-block">1-2 預習筆記</span> 交代預習</span><span><span class="chip k-due" style="display:inline-block">截止</span> 線上任務截止</span><span><span class="chip k-boss" style="display:inline-block">魔王挑戰</span></span><span><span class="chip k-exam" style="display:inline-block">段考</span></span><span><span class="chip k-note" style="display:inline-block"><span class="tag ntag">老師備</span><span class="tag ntag stu">學生帶</span></span> 準備事項（不佔課）</span></div>';
}
function chip(e){
  var cls='chip k-'+e.kind+(e.unit!=null?' '+uc(e.unit):'');
  if(st.dragOn&&e.keys&&e.keys.length){
    var ov=(cur()&&cur().overrides)||{}, pin=e.keys.some(function(k){return ov[k]!=null;});
    var pk=st.pick&&st.pick.join('|')===e.keys.join('|');
    return '<span class="'+cls+' drag'+(pin?' pinned':'')+(pk?' picked':'')+'" draggable="true" tabindex="0" role="button" data-keys="'+esc(e.keys.join('|'))+'" title="拖曳到其他日期，或點一下再點目標日期'+(pin?'（已手動調整）':'')+'">'+chipInner(e)+'</span>';
  }
  return '<span class="'+cls+'">'+chipInner(e)+'</span>';
}
function chipInner(e){
  var t=e.text;
  if(e.kind==='note') return '<span class="tag ntag'+(e.who==='student'?' stu':'')+'">'+(e.who==='student'?'學生帶':'老師備')+'</span>'+esc(t);
  if(e.kind==='open') return '<span class="tag '+uc(e.unit)+'">開放</span>'+esc(st.mode==='print'?t.replace(/（(\d+\/\d+) 截止）/g,'→$1').replace(/；/g,'、'):t);
  if(e.kind==='due') return '<span class="tag" style="background:var(--danger);color:var(--surface)">截止</span>'+esc(t.replace(' 截止：','：'));
  return esc(t);
}
function chipOld(e){
  var cls='chip k-'+e.kind+(e.unit!=null?' '+uc(e.unit):'');
  var t=e.text;
  if(e.kind==='open') return '<span class="'+cls+'"><span class="tag '+uc(e.unit)+'">開放</span>'+esc(t)+'</span>';
  if(e.kind==='due') return '<span class="'+cls+'"><span class="tag" style="background:var(--danger);color:var(--surface)">截止</span>'+esc(t.replace(' 截止：','：'))+'</span>';
  return '<span class="'+cls+'">'+esc(t)+'</span>';
}
function e0(evs,sa,su){return evs.some(function(e){return e.kind==='write'&&e.date===su;})?su:sa;}
function weekNo(cal,mon){ if(!isDate(cal.semStart)) return null; return Math.floor(diff(monday(cal.semStart),mon)/7)+1; }
function weekTable(cal,S,weeks){
  var days=cal.classDays||[1,2,4,5], today=st.mode==='print'?'':todayStr();
  var mons=weeks; if(!mons){mons=[];for(var m=monday(S.range.from);m<=monday(S.range.to);m=add(m,7)) mons.push(m);}
  // 有課的日子欄位寬、沒課的星期三與週末窄
  var wts=[0.55].concat([1,2,3,4,5].map(function(n){return days.indexOf(n)>=0?3:1.2;})).concat([1.5]);
  var tot=wts.reduce(function(a,b){return a+b;},0);
  var h='<table class="wcal"><colgroup>'+wts.map(function(w){return '<col style="width:'+(w/tot*100).toFixed(2)+'%">';}).join('')+'</colgroup><thead><tr><th>週次</th>'+[1,2,3,4,5].map(function(n){return '<th>'+(days.indexOf(n)<0?'週'+WK[n]+'<span class="muted" style="font-weight:400">（無課）</span>':'星期'+WK[n])+'</th>';}).join('')+'<th>週末</th></tr></thead><tbody>';
  mons.forEach(function(mon){
    var wn=weekNo(cal,mon);
    h+='<tr><th class="wk">'+(wn?'第<b>'+wn+'</b>週':'<b>'+md(mon)+'</b>起')+'</th>';
    for(var k=0;k<5;k++){var d=add(mon,k);h+=dayCell(cal,S,d,days.indexOf(dow(d))>=0,today);}
    // weekend merged
    var sa=add(mon,5), su=add(mon,6);
    var evs=eventsOn(S,sa).concat(eventsOn(S,su).filter(function(e){return !(e.end&&e.date<=sa&&e.end>=su);}));
    var seen={}; evs=evs.filter(function(e){var k2=e.kind+e.text+e.date;if(seen[k2])return false;seen[k2]=1;return true;});
    var out=(sa<S.range.from&&su<S.range.from)||sa>S.range.to;
    h+='<td class="noclass we'+(out?' out':'')+((today===sa||today===su)?' today':'')+'">'+[sa,su].map(function(x){
      var ev2=eventsOn(S,x).filter(function(e){return !(e.kind==='write'&&e.date!==x);});
      if(x===su) ev2=ev2.filter(function(e){return !(e.end&&e.date<=sa&&e.end>=su);});
      return '<div class="wz" data-date="'+x+'"><div class="d"><span class="num">'+md(x)+'（'+WK[dow(x)]+'）'+addBtn(x)+'</span></div>'+cellBody(ev2,x)+'</div>';}).join('')+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
var CLASSK={class:1,fixed:1,boss:1,exam:1};
function addBtn(d){ return st.dragOn?'<button class="addnote" data-addnote="'+d+'" title="新增準備事項" aria-label="在 '+md(d)+' 新增準備事項">＋</button>':''; }
function cellBody(evs,d){
  evs=evs.filter(function(e){return e.kind!=='holiday'&&!(e.kind==='write'&&e.date!==d);});
  var a=evs.filter(function(e){return CLASSK[e.kind];}), b=evs.filter(function(e){return !CLASSK[e.kind]&&e.kind!=='note';}), c=evs.filter(function(e){return e.kind==='note';});
  return a.map(chip).join('')+(b.length?'<div class="cellsec">作業</div>'+b.map(chip).join(''):'')+(c.length?'<div class="cellsec">準備</div>'+c.map(chip).join(''):'');
}
function dayCell(cal,S,d,isClass,today){
  var evs=eventsOn(S,d), hol=S.hol[d];
  var out=d<S.range.first||d>S.range.to;
  var cls=[]; if(hol) cls.push('hol'); else if(!isClass) cls.push('noclass'); if(d===today) cls.push('today'); if(out) cls.push('out');
  var ld=S.load[d]; var over=ld>1+1e-9;
  var wl=(!hol&&isClass&&S.weekly[dow(d)])?'<span class="wlabel">'+esc(S.weekly[dow(d)])+'</span>':'';
  return '<td class="'+cls.join(' ')+'" data-date="'+d+'"><div class="d"><span class="num">'+md(d)+addBtn(d)+'</span>'+(hol?'<span>'+esc(hol)+'</span>':(over?'<span class="load">'+ld+' 節</span>':wl))+'</div>'+cellBody(evs,d)+'</td>';
}

/* ---------- gantt ---------- */
function ganttLegend(){
  return '<div class="legend"><span><span class="gbar write u0"></span>預習筆記（交代→繳交）</span><span><span class="gmark submit u0">交</span>繳交預習</span>'+['訂正','概念釐清','分組挑戰','實驗','競賽之盾'].map(function(k){return '<span><span class="gmark u0">'+abbr(k)+'</span>'+lbl(k)+'</span>';}).join('')+'<span><span class="gmark fixed">固</span>固定課</span>'+'<span><span class="gbar u0"></span>線上作業開放期間（標示截止日）</span><span><span class="gbar self u0"></span>預習期間的自主學習作業</span><span><span class="gmark boss">魔</span>魔王挑戰</span><span><span class="gmark exam">考</span>段考</span></div>';
}
function gantt(cal,S,forPrint){
  var from=S.range.from,to=S.range.to,N=diff(from,to)+1,today=todayStr();
  var cw=forPrint?'minmax(0,1fr)':'minmax(22px,1fr)';
  var tmpl='grid-template-columns:'+(forPrint?'26mm':'150px')+' repeat('+N+','+cw+')';
  var col=function(d){return diff(from,d)+2;};
  var bg=function(){var s='';for(var k=0;k<N;k++){var d=add(from,k),w=dow(d);var c='gbg'+((w===0||w===6)?' we':'')+(S.hol[d]?' hol':'')+(!forPrint&&d===today?' today':'');s+='<div class="'+c+'" style="grid-column:'+(k+2)+'"></div>';}return s;};
  var row=function(label,cls,items){return '<div class="grow-row '+cls+'" style="'+tmpl+'"><div class="glabel">'+label+'</div>'+bg()+items+'</div>';};
  var h='<div class="gantt" style="'+tmpl+'">';
  // header
  var hd='';for(var k=0;k<N;k++){var d=add(from,k);hd+='<div class="gbg'+((dow(d)%6===0)?' we':'')+(S.hol[d]?' hol':'')+'" style="grid-column:'+(k+2)+'">'+((k===0||P(d).getUTCDate()===1||(!forPrint&&dow(d)===1))?'<b>'+(forPrint?(P(d).getUTCMonth()+1)+'/<br>'+P(d).getUTCDate():md(d))+'</b>':'<b>'+P(d).getUTCDate()+'</b>')+WK[dow(d)]+'</div>';}
  h+='<div class="grow-row ghead" style="'+tmpl+'"><div class="glabel muted">單元 / 日期</div>'+hd+'</div>';
  S.units.forEach(function(r){
    var u=cal.units[r.i], c=uc(r.i), it='';
    if(r.write) it+='<div class="gbar write '+c+'" style="grid-column:'+col(r.write.start)+'/'+(col(r.write.end)+1)+'">預習</div>';
    if(r.dates['預習']) it+='<div class="gmark submit '+c+'" style="grid-column:'+col(r.dates['預習'])+'" title="繳交預習 '+mdw(r.dates['預習'])+'">交</div>';
    stepsOf(u).forEach(function(s){var d=r.dates[s]; if(d) it+='<div class="gmark '+c+'" style="grid-column:'+col(d)+'" title="'+esc(lbl(s)+' '+mdw(d))+'">'+abbr(s)+'</div>';});
    h+=row('<span class="tag '+c+'">'+esc(r.code)+'</span>'+esc(r.name),'unit-row',it);
    // 線上作業：同一列，時間重疊的才往下疊
    if(r.online.length){
      var lanes=[], bars=r.online.slice().sort(function(x,y){return x.open<y.open?-1:x.open>y.open?1:0;}).map(function(o){
        var L=0; while(lanes[L]&&lanes[L]>=o.open) L++; lanes[L]=o.due; return {o:o,L:L}; });
      var nL=lanes.length;
      var it2=bars.map(function(x){ var o=x.o, a=col(o.open), b=col(o.due)+1; if(b<=a) b=a+1;
        return '<div class="gbar lane '+c+(o.self?' self':'')+'" style="grid-column:'+a+'/'+b+';align-self:start;margin-top:'+(2+x.L*11)+'px" title="'+esc(o.name+' '+md(o.open)+'–'+md(o.due))+'">'+esc(o.name)+' '+esc(md(o.due))+'</div>'; }).join('');
      h+='<div class="grow-row sub" style="'+tmpl+';min-height:'+(4+nL*11)+'px"><div class="glabel">線上作業</div>'+bg()+it2+'</div>';
    }
  });
  var fixedEv=S.events.filter(function(e){return e.kind==='fixed'&&e.date>=from&&e.date<=to;});
  if(fixedEv.length) h+=row('<b>固定課</b>','unit-row',fixedEv.map(function(e){return '<div class="gmark fixed" style="grid-column:'+col(e.date)+'" title="'+esc(e.text+' '+mdw(e.date))+'">'+esc(abbr(e.text))+'</div>';}).join(''));
  var fin='<div class="gmark boss" style="grid-column:'+col(S.boss)+'">魔</div>';
  for(var x=cal.examStart;x<=S.examEnd;x=add(x,1)) fin+='<div class="gmark exam" style="grid-column:'+col(x)+'">考</div>';
  h+=row('<b>魔王挑戰．段考</b>','unit-row',fin);
  return h+'</div>';
}

/* ---------- student ---------- */

  var cls=evs.filter(function(e){return e.kind==='class'||e.kind==='fixed';});

  h+='<section class="card"><h3>今天的自然課'+(S.hol[d]?'<span class="small muted">'+esc(S.hol[d])+'</span>':wlab?'<span class="small muted">'+esc(wlab)+'</span>':'')+'</h3>';
  if(S.hol[d]) h+='<p class="muted" style="margin:0">放假，沒有課。</p>';
  else if(cls.length) h+='<ul class="tasks">'+cls.map(function(e){return '<li><span class="what">'+chip(e)+'</span><span class="when">'+stepHint(e.step)+'</span></li>';}).join('')+'</ul>';
  else if(d===S.boss) h+='<p style="margin:0"><b>魔王挑戰</b>：綜合所有單元的挑戰，段考前最後一次練習。</p>';
  else h+='<p class="muted" style="margin:0">'+(isClass?'這節沒有排定新進度，可以補完線上任務。':'今天沒有自然課。')+'</p>';
  h+='</section>';
  var prep=evs.filter(function(e){return e.kind==='note'&&e.who==='student';}).concat(eventsOn(S,tomorrow).filter(function(e){return e.kind==='note'&&e.who==='student';}).map(function(e){return Object.assign({},e,{tmr:true});}));
  if(prep.length) h+='<section class="card"><h3>要帶的東西</h3><ul class="tasks">'+prep.map(function(e){return '<li><span class="what">'+esc(e.text)+'</span><span class="when">'+(e.tmr?'明天 '+mdw(e.date):'今天')+'</span></li>';}).join('')+'</ul></section>';
  var hw=evs.filter(function(e){return e.kind==='open'||e.kind==='custom';});

  if(wr.length) h+='<section class="card"><h3>預習筆記</h3><ul class="tasks">'+wr.map(function(e){var sub=S.events.find(function(x){return x.kind==='submit'&&x.unit===e.unit;});return '<li><span class="what">'+chip(e)+'</span><span class="when">'+(sub?mdw(sub.date)+' 繳交':'')+'</span></li>';}).join('')+'</ul></section>';
  // ongoing online

/* 每一頁縮放到剛好放進 A4 橫式（281mm × 194mm 可印範圍） */
function fitPages(){
  var mm=96/25.4, H=192*mm;
  document.querySelectorAll('.print-page').forEach(function(pg){
    pg.style.zoom=''; var h=pg.scrollHeight; var z=Math.min(1,H/h);
    if(z<1) pg.style.zoom=z.toFixed(3);
  });
}

  keys.forEach(function(k){
    if(k.indexOf('note:')===0){ var n=(cal.notes||[]).find(function(x){return 'note:'+x.id===k;}); if(n) n.date=date; }
    else cal.overrides[k]=date;

      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){showICS(txt);});} else showICS(txt);};
  }
}
function showICS(txt){var v=$('view');var pre=document.createElement('pre');pre.className='ics';pre.textContent=txt;v.appendChild(pre);var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r);toast('已選取內容，請按複製');}
function clearUnitOv(cal,i){ var o=cal.overrides||{}; Object.keys(o).forEach(function(k){ if(k.indexOf(i+':')===0) delete o[k]; }); }
function nextCode(c){ if(!c) return '1-1'; var m=String(c).match(/^(\d+)-(\d+)$/); return m?m[1]+'-'+(+m[2]+1):''; }
function shiftOv(cal,op,i,j){
  var o=cal.overrides||{}, n={};
  Object.keys(o).forEach(function(k){
    var m=k.match(/^(\d+):(.+)$/); if(!m){n[k]=o[k];return;}
    var u=+m[1], rest=m[2];
    if(op==='rm'){ if(u===i) return; if(u>i) u--; }
    else if(op==='ins'){ if(u>=i) u++; }
    else if(op==='swap'){ if(u===i) u=j; else if(u===j) u=i; }
    else if(op===null){ var unit=cal.units[u]; if(unit&&rest!=='預習'&&!/^on\d+$/.test(rest)&&stepsOf(unit).indexOf(rest)<0) return; }
    n[u+':'+rest]=o[k];
  });
  cal.overrides=n;
}

/* ---------- Google Calendar import (viewer's connector) ---------- */
var GC='Google Calendar', TW_HOL='zh-tw.taiwan#holiday@group.v.calendar.google.com';
var HOLWORDS=/補假|放假|休假|國慶|中秋|教師節|元旦|春節|除夕|和平紀念|兒童節|清明|勞動節|端午|光復|行憲|颱風/;
function gDate(t){ if(!t) return null; if(t.date) return String(t.date).slice(0,10); if(t.dateTime){var d=new Date(t.dateTime);return F(new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())));} return null; }
function gRange(e){ var a=gDate(e.start), b=gDate(e.end); if(!a) return null; if(e.end&&e.end.date&&b>a) b=add(b,-1); return {start:a,end:b&&b>=a?b:a,name:e.summary||''}; }
function gcalPanel(cal){
  var g=st.gc||{};
  if(st.mcpOff) return '';
  var h='<div class="rule" style="display:flex;flex-direction:column;gap:8px"><div><b>從 Google 日曆帶入</b>：讀取學校行事曆裡的段考日期，以及這段期間的國定假日。</div>';
  if(!g.cals){ h+='<div><button class="btn" id="gcLoad"'+(g.busy?' disabled':'')+'>'+(g.busy?'讀取中…':'連結 Google 日曆')+'</button></div>'; }
  else{
    h+='<div class="row"><label class="field grow"><span>學校行事曆</span><select id="gcCal">'+g.cals.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===g.calId?' selected':'')+'>'+esc(c.summary||c.id)+'</option>';}).join('')+'</select></label><button class="btn" id="gcExam"'+(g.busy?' disabled':'')+'>'+(g.busy?'讀取中…':'找段考日期')+'</button></div>';
    if(g.exams){ h+=g.exams.length?'<div class="row">'+g.exams.map(function(x,k){return '<button class="btn" data-gex="'+k+'">'+esc(x.name)+'　'+md(x.start)+(x.end!==x.start?'–'+md(x.end):'')+'</button>';}).join('')+'</div>':'<div>這個行事曆在本學年找不到「段考」。</div>'; }
    if(g.hols){
      h+=g.hols.length?'<div><b>期間內的假日</b>（勾選後加入放假日）</div><div class="stack" style="gap:4px">'+g.hols.map(function(x,k){return '<label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="gch'+k+'" data-gch="'+k+'"'+(x.on?' checked':'')+'>'+esc(mdw(x.start)+(x.end!==x.start?'–'+mdw(x.end):''))+'　'+esc(x.name)+'<span class="muted">'+esc(x.src)+'</span></label>';}).join('')+'</div><div><button class="btn primary" id="gcAddHol">加入放假日</button></div>':'<div>這段期間沒有找到平日假日。</div>';
    }
  }
  if(g.err) h+='<div style="color:var(--danger)">'+esc(g.err)+'</div>';
  return h+'</div>';
}
function gErr(e){
  var c=e&&e.code;
  if(c==='not_granted'||c==='denied') return '沒有取得 Google 日曆的使用許可。';
  if(c==='server_not_connected'||c==='needs_reauth') return '請先在 claude.ai 的連接器設定連上 Google 日曆。';
  return '讀取 Google 日曆失敗（'+(c||'未知錯誤')+'）。';
}
async function gcCall(tool,input){ var r=await st.mcp.callTool(GC,tool,input,{cache:false}); return r.payload||{}; }
function gcRerender(){ var v=$('view'); if(!v||st.tab!=='setup') return; render(); }
function bindGcal(cal){
  var g=st.gc=st.gc||{};
  var L=$('gcLoad'); if(L) L.onclick=async function(){ g.busy=true; g.err=null; gcRerender();
    if(!st.mcp){ st.mcp=await withTimeout(window.claude&&window.claude.use?window.claude.use('mcp'):null,15000,null); }
    if(!st.mcp){ g.busy=false; g.err='這個檢視無法連到 Google 日曆。'; gcRerender(); return; }
    try{ var p=await gcCall('list_calendars',{}); g.cals=(p.calendars||[]).filter(function(c){return c.id!==TW_HOL;});
      var pick=g.cals.find(function(c){return /全校行事曆/.test(c.summary||'');})||g.cals.find(function(c){return /行事曆|教務/.test(c.summary||'');})||g.cals[0];
      g.calId=pick&&pick.id; }
    catch(e){ g.err=gErr(e); }
    g.busy=false; gcRerender(); };
  var S2=$('gcCal'); if(S2) S2.onchange=function(){ g.calId=S2.value; g.exams=null; };
  var X=$('gcExam'); if(X) X.onclick=async function(){ g.busy=true; g.err=null; gcRerender();
    try{
      var base=isDate(cal.start)?cal.start:todayStr();
      var p=await gcCall('list_events',{calendarId:g.calId,fullText:'段考',startTime:add(base,-60)+'T00:00:00+08:00',endTime:add(base,300)+'T00:00:00+08:00',orderBy:'startTime',pageSize:50,timeZone:'Asia/Taipei'});
      g.exams=(p.events||[]).map(gRange).filter(Boolean).filter(function(x){return /段考|定期評量/.test(x.name);});
    }catch(e){ g.err=gErr(e); }
    g.busy=false; gcRerender(); };
  app.querySelectorAll('[data-gex]').forEach(function(b){ b.onclick=async function(){
    var x=g.exams[+b.dataset.gex]; cal.examName=x.name; cal.examStart=x.start; cal.examEnd=x.end;
    g.busy=true; g.err=null; render();
    try{ g.hols=await findHols(cal,g.calId); }catch(e){ g.err=gErr(e); }
    g.busy=false; render(); toast('已帶入 '+x.name+' 日期');
  };});
  app.querySelectorAll('[data-gch]').forEach(function(c){ c.onchange=function(){ g.hols[+c.dataset.gch].on=c.checked; }; });
  var A=$('gcAddHol'); if(A) A.onclick=function(){
    var have=parseLines(cal.holidays,cal.start).map(function(h){return h.start;});
    var add2=g.hols.filter(function(x){return x.on&&have.indexOf(x.start)<0;}).map(function(x){return x.start+(x.end!==x.start?'~'+x.end:'')+' '+x.name;});
    cal.holidays=(cal.holidays?cal.holidays.replace(/\s+$/,'')+'\n':'')+add2.join('\n');
    g.hols=null; render(); toast(add2.length?'已加入 '+add2.length+' 筆放假日':'這些日期已經在清單裡');
  };
}
async function findHols(cal,schoolId){
  var from=monday(isDate(cal.start)?cal.start:todayStr())+'T00:00:00+08:00', to=add(cal.examEnd||cal.examStart,1)+'T00:00:00+08:00';
  var out=[], seen={};
  var push=function(evs,src,onlyOff){ (evs||[]).forEach(function(e){ var r=gRange(e); if(!r) return;
    var wd=false; for(var d=r.start;d<=r.end;d=add(d,1)){ if(dow(d)>=1&&dow(d)<=5) wd=true; }
    if(!wd) return; if(onlyOff&&!/放假|補假|休假|停課/.test(r.name)) return;
    if(seen[r.start+r.name]) return; seen[r.start+r.name]=1;
    out.push({start:r.start,end:r.end,name:r.name,src:src,on:HOLWORDS.test(r.name)}); }); };
  var a=await gcCall('list_events',{calendarId:TW_HOL,startTime:from,endTime:to,orderBy:'startTime',pageSize:100,timeZone:'Asia/Taipei'}).catch(function(){return {};});
  push(a.events,'　國定假日',false);
  if(schoolId){ var b=await gcCall('list_events',{calendarId:schoolId,startTime:from,endTime:to,orderBy:'startTime',pageSize:250,timeZone:'Asia/Taipei'}); push(b.events,'　學校行事曆',true); }
  out.sort(function(x,y){return x.start<y.start?-1:1;});
  return out;
}

/* ---------- data (artifact db) ---------- */
// All calendars live in ONE document (STORE_DOC.items). Inside it every field name is plain ASCII:
// overrides and weights (whose keys are Chinese text / contain ':') are stored as lists of {k,v}.
var STORE_DOC='app/calendars';
function kvList(o){ o=o||{}; return Object.keys(o).map(function(k){return {k:k,v:o[k]};}); }
function kvObj(x){ if(Array.isArray(x)){ var o={}; x.forEach(function(p){ if(p&&p.k!=null) o[p.k]=p.v; }); return o; } return (x&&typeof x==='object')?x:{}; }
function toStore(cal){ var c=clone(cal); c.overrides=kvList(cal.overrides); c.weights=kvList(cal.weights); return c; }
function fromStore(x){ x=clone(x); x.overrides=kvObj(x.overrides); x.weights=kvObj(x.weights); return x; }
function selectCal(id){
  st.selId=id; ls('esc.sel',id); st.confirmDel=false;
  var c=st.list.find(function(x){return x.id===id;});
  if(st.teacher&&c){ st.saved=clone(c); st.draft=clone(c); }
  render();
}
async function writeAll(list){ await st.db.doc(STORE_DOC).set({items:list.map(toStore),updated:new Date().toISOString()}); if(SITE) onList(list.map(clone)); }
/* ---------- GitHub 儲存（網站版） ---------- */
function b64enc(str){ var b=new TextEncoder().encode(str), s2=''; for(var i=0;i<b.length;i+=0x8000) s2+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s2); }
function b64dec(b64){ var bin=atob(String(b64).replace(/\s/g,'')), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new TextDecoder().decode(a); }
function ghToken(){ return ls('esc.ghtoken')||''; }
function githubStore(site){
  var branch=site.branch||'main', sha=null;
  var apiUrl=function(){ return 'https://api.github.com/repos/'+site.repo+'/contents/'+(site.ghpath||site.path); };
  var hdr=function(){ return {Authorization:'Bearer '+ghToken(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; };
  async function viaApi(){
    var r=await fetch(apiUrl()+'?ref='+encodeURIComponent(branch),{headers:hdr(),cache:'no-store'});
    if(r.status===404) return {exists:false};
    if(r.status===401||r.status===403) throw {code:'token_invalid',message:'GitHub 金鑰無效或權限不足（請確認金鑰有這個儲存庫的 Contents 讀寫權限）'};
    if(!r.ok) throw {code:'github_'+r.status};
    var j=await r.json(); sha=j.sha; return {exists:true,data:JSON.parse(b64dec(j.content))};
  }
  async function viaPages(){
    var r=await fetch(site.path+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404) return {exists:false};
    if(!r.ok) throw {code:'http_'+r.status};
    return {exists:true,data:await r.json()};
  }
  async function load(){ return (site.role==='teacher'&&ghToken())?viaApi():viaPages(); }
  var snap=function(x){ return {exists:x.exists,data:function(){return x.data;}}; };
  return {doc:function(){ return {
    get:async function(){ return snap(await load()); },
    onSnapshot:function(next,err){ load().then(function(x){ next(snap(x)); }).catch(function(e){ if(err) err(e); }); return function(){}; },
    set:async function(data){
      if(site.role!=='teacher') throw {code:'read_only'};
      if(!ghToken()) throw {code:'no_token',message:'請先設定 GitHub 金鑰'};
      if(!sha){ try{ await viaApi(); }catch(e){ if(e&&e.code==='token_invalid') throw e; } }
      var body={message:'更新段考學習行事曆 '+new Date().toLocaleString('zh-TW'),content:b64enc(JSON.stringify(data,null,1)),branch:branch};
      if(sha) body.sha=sha;
      var r=await fetch(apiUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)});
      if(r.status===409||r.status===422){ sha=null; throw {code:'conflict',message:'GitHub 上的資料已被更新，請重新整理頁面後再儲存'}; }
      if(r.status===401||r.status===403) throw {code:'token_invalid',message:'GitHub 金鑰無效或權限不足'};
      if(!r.ok) throw {code:'github_'+r.status};
      var j=await r.json(); sha=j.content&&j.content.sha;
    }
  };}};
}
async function createCal(c){
  if(!st.db){toast('無法連線到資料庫');return;}
  if(st.creating) return; st.creating=true; toast('建立中…');
  var id='c'+Date.now().toString(36); c.id=id; c.updated=new Date().toISOString();
  try{ st.pendingSel=id; await writeAll(st.list.concat([c])); st.tab='setup'; toast('已建立，請在「設定」填寫內容'); }
  catch(e){ st.pendingSel=null; toast('建立失敗：'+(e&&e.code||'')); }
  finally{ st.creating=false; }
}
async function saveCal(){
  if(!st.db||!st.draft) return;
  var c=clone(st.draft); c.updated=new Date().toISOString();
  var b=$('saveBtn'); if(b) b.disabled=true;
  var list=st.list.filter(function(x){return x.id!==c.id;}).concat([c]);
  try{ await writeAll(list); st.saved=clone(c); st.draft=c; ls('esc.draft.'+c.id,''); toast('已儲存，學生端已更新'); render(); }
  catch(e){ toast('儲存失敗：'+(e&&(e.message||e.code)||'請再試一次')); if(b) b.disabled=false; }
}
async function deleteCal(){
  if(!st.db||!st.draft) return;
  var id=st.draft.id;
  try{ await writeAll(st.list.filter(function(x){return x.id!==id;})); st.confirmDel=false; st.selId=null; st.draft=null; st.saved=null; toast('已刪除'); }
  catch(e){ toast('刪除失敗'); }
}
// 網站學生頁：網址加 #g7 或 #g8 只顯示該年級（方便從 BioQuest／SciQuest 連過來）
function gradeFilter(docs){
  if(!SITE||SITE.role==='teacher') return docs;
  var m=String(location.hash||'').match(/g([7-9])/i); if(!m) return docs;
  var ch={'7':'七','8':'八','9':'九'}[m[1]];
  var f=docs.filter(function(c){ return String(c.grade||'').indexOf(ch)>=0||String(c.title||'').indexOf(ch+'年級')>=0; });
  return f.length?f:docs;
}
function onList(docs){
  docs=gradeFilter(docs);
  st.loaded=true;
  st.list=docs.sort(function(a,b){return String(b.updated||'').localeCompare(String(a.updated||''));});
  var want=st.pendingSel||st.selId||ls('esc.sel');
  if(!st.list.some(function(c){return c.id===want;})) want=st.list[0]&&st.list[0].id;
  var changedSel=want!==st.selId; st.selId=want; st.pendingSel=null;
  var c=st.list.find(function(x){return x.id===want;});
  if(st.teacher){
    if(!c){st.draft=null;st.saved=null;}
    else if(changedSel||!dirty()){ st.saved=clone(c); st.draft=clone(c); }
    else st.saved=clone(c);
  }
  // keep focus-safe: don't rerender while typing in setup unless needed
  var ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#view')&&st.tab==='setup'&&!changedSel&&dirty()){ refreshSoft(); return; }
  render();
}

function guessRepo(){
  var host=location.hostname, parts=location.pathname.split('/').filter(Boolean);
  if(parts.length&&/\.html?$/.test(parts[parts.length-1])) parts.pop();
  var owner=/\.github\.io$/.test(host)?host.split('.')[0]:'';
  if(!owner) return {repo:'',path:'data/calendars.json'};
  if(parts.length) return {repo:owner+'/'+parts[0],path:parts.slice(1).concat(['data','calendars.json']).join('/')};
  return {repo:owner+'/'+owner+'.github.io',path:'data/calendars.json'};
}
function bootSite(){
  if(SITE.role==='teacher'){ var g=guessRepo(); SITE.repo=SITE.repo||ls('esc.ghrepo')||g.repo; SITE.ghpath=SITE.ghpath||ls('esc.ghpath')||g.path; }
  st.site=true; st.teacher=SITE.role==='teacher'; st.db=githubStore(SITE);
  render();
  var handle=function(snap){ var raw=(snap&&snap.exists&&snap.data()&&snap.data().items)||[]; var docs=[]; raw.forEach(function(x){ if(x&&x.id) docs.push(fromStore(x)); }); st.okRead=true; onList(docs); };
  st.db.doc(STORE_DOC).onSnapshot(handle,function(err){ st.loaded=true; st.loadErr='讀取失敗（'+(err&&(err.message||err.code)||'未知錯誤')+'）'; render(); });
}
function withTimeout(p,ms,fallback){ return Promise.race([Promise.resolve(p).catch(function(){return fallback;}), new Promise(function(r){setTimeout(function(){r(fallback);},ms);})]); }
async function boot(){
  if(st.mode!=='app'){ render(); return; }
  st.tab=ls('esc.tab')||null;
  if(SITE){ return bootSite(); }
  render();
  setTimeout(function(){ if(!st.loaded){ st.slow=true; render(); } },9000);
  if(!window.claude||!window.claude.use){ st.loaded=true; st.dbMissing=true; render(); return; }
  var C=window.claude;
  withTimeout(C.use('downloads'),15000,null).then(function(d){ st.dl=d; });
  // who is viewing: decide teacher mode independently of the data load
  withTimeout(C.use('user'),15000,null).then(function(user){
    if(!user) return false;
    return withTimeout(user.canEdit(),8000,false);
  }).then(function(t){
    st.teacher=!!t;
    if(st.teacher&&st.loaded){ var c=st.list.find(function(x){return x.id===st.selId;}); if(c&&!st.draft){ st.saved=clone(c); st.draft=clone(c);} }
    render();
  });
  var db=await withTimeout(C.use('db'),15000,null);
  st.db=db;
  if(!db){ st.loaded=true; st.dbMissing=true; render(); return; }
  var ref=db.doc(STORE_DOC);
  var handle=function(snap){
    var raw=(snap&&snap.exists&&snap.data()&&snap.data().items)||[];
    var docs=[]; raw.forEach(function(x){ if(x&&x.id) docs.push(fromStore(x)); });
    st.okRead=true; onList(docs);
  };
  withTimeout(ref.get(),12000,null).then(function(snap){ if(snap&&!st.gotSnap){ try{handle(snap);}catch(e){} } });
  try{
    ref.onSnapshot(function(snap){
      try{ st.gotSnap=true; handle(snap); }
      catch(e){ st.loaded=true; st.loadErr=String(e&&e.message||e); render(); }
    },function(err){ if(st.okRead){ toast('即時更新已中斷，重新開啟頁面可恢復'); return; } st.loaded=true; st.loadErr='讀取失敗（'+(err&&err.code||'未知錯誤')+(err&&err.message?'：'+err.message:'')+'）'; render(); });
  }catch(e){ st.loaded=true; st.loadErr=String(e&&e.message||e); render(); }
}
window.addEventListener('beforeunload',function(e){ if(dirty()){ e.preventDefault(); e.returnValue=''; } });
boot();
})();
